/* =========================================================

========================================================= */

/*
    This is the important part.

    Globe.gl will manage this object itself.
    We do NOT use:

        globe.scene().add()

    anymore.
*/

const santaObjectData = [

    {
        id:"santa"
    }

];


/* =========================================================
   GLOBE OBJECT LAYER
========================================================= */

globe

    .objectsData([])

    .objectLat(function(d){

        return d.lat || 0;

    })

    .objectLng(function(d){

        return d.lng || 0;

    })

    .objectAltitude(function(d){

        return .20;

    })

    .objectRotation(function(d){

        return [0,0,0];

    })

    .objectThreeObject(function(d){

        /*
            Globe.gl asks for the Three.js object here.

            We return the loaded Santa model.
        */

        if(!santaModelTemplate){

            return new THREE.Group();

        }


        /*
            Clone the loaded model so Globe.gl
            owns the object it inserts.
        */

        const clone =
            santaModelTemplate.clone(true);


        clone.scale.set(
            .08,
            .08,
            .08
        );


        clone.traverse(function(object){

            if(object.isMesh){

                object.frustumCulled = false;

                if(object.material){

                    object.material.needsUpdate =
                        true;

                }

            }

        });


        santaObject =
            clone;

        santaObjectReady =
            true;


        return clone;

    });


/* =========================================================

========================================================= */

function loadSantaModel(){

    modelNotice.style.display =
        "block";

    modelNotice.textContent =
        "🎅 Loading santa.gltf...";


    const loader =
        new THREE.GLTFLoader();


    loader.load(

        "./" + MODEL_FILE,

        function(gltf){

            console.log(
                "🎅 santa.gltf successfully loaded!"
            );


            santaModelTemplate =
                gltf.scene;


            santaModelTemplate.traverse(
                function(object){

                    if(object.isMesh){

                        object.frustumCulled =
                            false;

                        if(object.material){

                            object.material.needsUpdate =
                                true;

                        }

                    }

                }
            );


            /*
                Now give the model to Globe.gl.

                Globe.gl creates/manages the actual
                object through objectThreeObject().
            */

            globe.objectsData(
                santaObjectData
            );


            modelNotice.textContent =
                "🎅 Santa's sleigh loaded!";


            setTimeout(function(){

                modelNotice.style.display =
                    "none";

            },3000);


            console.log(
                "🎅 Santa has been registered with Globe.gl's object system."
            );

        },

        function(progress){

            if(progress.total){

                const percent =
                    Math.round(
                        progress.loaded /
                        progress.total *
                        100
                    );


                modelNotice.textContent =
                    "🎅 Loading Santa... " +
                    percent +
                    "%";

            }

        },

        function(error){

            console.error(
                "Error loading santa.gltf:",
                error
            );


            modelNotice.style.display =
                "block";


            modelNotice.textContent =
                "⚠️ santa.gltf could not be loaded. Make sure santa.gltf is beside index.html.";

        }

    );

}

/* =========================================================
   GREAT CIRCLE INTERPOLATION
========================================================= */

function interpolateGreatCircle(
    start,
    end,
    fraction
){

    const lat1 =
        start.lat *
        Math.PI /
        180;

    const lon1 =
        start.lng *
        Math.PI /
        180;

    const lat2 =
        end.lat *
        Math.PI /
        180;

    const lon2 =
        end.lng *
        Math.PI /
        180;


    const a = {

        x:
            Math.cos(lat1) *
            Math.cos(lon1),

        y:
            Math.cos(lat1) *
            Math.sin(lon1),

        z:
            Math.sin(lat1)

    };


    const b = {

        x:
            Math.cos(lat2) *
            Math.cos(lon2),

        y:
            Math.cos(lat2) *
            Math.sin(lon2),

        z:
            Math.sin(lat2)

    };


    const dot =
        a.x*b.x +
        a.y*b.y +
        a.z*b.z;


    const angle =
        Math.acos(
            Math.min(
                1,
                Math.max(
                    -1,
                    dot
                )
            )
        );


    if(angle < .0001){

        return {

            lat:
                start.lat +
                (end.lat - start.lat) *
                fraction,

            lng:
                start.lng +
                (end.lng - start.lng) *
                fraction

        };

    }


    const sinAngle =
        Math.sin(angle);


    const A =
        Math.sin(
            (1-fraction) *
            angle
        ) /
        sinAngle;


    const B =
        Math.sin(
            fraction *
            angle
        ) /
        sinAngle;


    const x =
        A*a.x +
        B*b.x;

    const y =
        A*a.y +
        B*b.y;

    const z =
        A*a.z +
        B*b.z;


    return {

        lat:
            Math.atan2(
                z,
                Math.sqrt(
                    x*x +
                    y*y
                )
            ) *
            180 /
            Math.PI,

        lng:
            Math.atan2(
                y,
                x
            ) *
            180 /
            Math.PI

    };

}

/* =========================================================

========================================================= */

function updateSantaGlobePosition(
    position
){

    /*
        Globe.gl reads latitude/longitude from
        objectsData.

        We update the data and tell Globe.gl
        to redraw the object.
    */

    santaObjectData[0].lat =
        position.lat;

    santaObjectData[0].lng =
        position.lng;


    globe.objectsData(
        santaObjectData
    );

}

/* =========================================================
   SANTA ANIMATION
========================================================= */

function animateSanta(){

    if(!trackingStarted){

        animationRunning =
            false;

        return;

    }


    if(!santaModelTemplate){

        requestAnimationFrame(
            animateSanta
        );

        return;

    }


    if(routeIndex >= route.length - 1){

        const finalStop =
            route[
                route.length - 1
            ];


        updateSantaGlobePosition(
            finalStop
        );


        locationText.textContent =
            finalStop.name;


        statusText.textContent =
            "Santa has arrived! 🎅🎄";


        countdownText.textContent =
            "ARRIVED!";


        animationRunning =
            false;


        return;

    }


    const start =
        route[routeIndex];


    const end =
        route[routeIndex + 1];


    const now =
        performance.now();


    let fraction =
        (
            now -
            segmentStartTime
        ) /
        SEGMENT_DURATION;


    if(fraction >= 1){

        routeIndex++;

        segmentStartTime =
            now;

        fraction = 0;

    }


    const position =
        interpolateGreatCircle(
            start,
            end,
            fraction
        );


    locationText.textContent =
        start.name +
        " → " +
        end.name;


    /*
        Update Globe.gl's object coordinates.
    */

    updateSantaGlobePosition(
        position
    );


    /*
        Find the next position so we can
        rotate Santa toward the direction
        he is flying.
    */

    const nextFraction =
        Math.min(
            1,
            fraction + .025
        );


    const nextPosition =
        interpolateGreatCircle(
            start,
            end,
            nextFraction
        );


    /*
        If Globe.gl has created the actual
        Santa object, rotate that object.
    */

    if(santaObject){

        const currentCoords =
            globe.getCoords(
                position.lat,
                position.lng,
                .20
            );


        const nextCoords =
            globe.getCoords(
                nextPosition.lat,
                nextPosition.lng,
                .20
            );


        const direction =
            new THREE.Vector3(
                nextCoords.x -
                currentCoords.x,

                nextCoords.y -
                currentCoords.y,

                nextCoords.z -
                currentCoords.z

            ).normalize();


        const up =
            new THREE.Vector3(
                currentCoords.x,
                currentCoords.y,
                currentCoords.z
            ).normalize();


        const right =
            new THREE.Vector3()
            .crossVectors(
                direction,
                up
            )
            .normalize();


        const correctedUp =
            new THREE.Vector3()
            .crossVectors(
                right,
                direction
            )
            .normalize();


        const matrix =
            new THREE.Matrix4();


        matrix.makeBasis(
            right,
            correctedUp,
            direction
        );


        santaObject.quaternion
            .setFromRotationMatrix(
                matrix
            );

    }


    requestAnimationFrame(
        animateSanta
    );

}

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(){

    const time =
        document
        .getElementById(
            "arrivalTime"
        )
        .value;


    if(!time){

        return;

    }


    const parts =
        time.split(":");


    const target =
        new Date();


    target.setHours(
        parseInt(parts[0]),
        parseInt(parts[1]),
        0,
        0
    );


    const now =
        new Date();


    if(target < now){

        target.setDate(
            target.getDate() + 1
        );

    }


    const difference =
        target.getTime() -
        now.getTime();


    const hours =
        Math.floor(
            difference /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60)
            ) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                difference %
                (1000 * 60)
            ) /
            1000
        );


    if(!trackingStarted){

        countdownText.textContent =
            "Arrival in " +
            hours +
            "h " +
            minutes +
            "m " +
            seconds +
            "s";

    }

}


setInterval(
    updateCountdown,
    1000
);
